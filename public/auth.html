<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Soundboard · Sign in</title>
    <style>
      :root { --bg: #f4f3ef; --ink: #1a1a18; --muted: #6b6b63; --line: #e4e2da; --accent: #534ab7; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh; display: grid; place-items: center; padding: 16px;
        background: var(--bg); color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      form {
        width: 100%; max-width: 360px; background: #fff; border-radius: 20px; padding: 24px;
        box-shadow: 0 1px 3px rgba(0,0,0,.06); outline: 1px solid rgba(0,0,0,.05);
      }
      .logo { width: 44px; height: 44px; display: grid; place-items: center; font-size: 24px;
        border-radius: 16px; background: #fff; outline: 1px solid rgba(0,0,0,.06); margin-bottom: 12px; }
      h1 { margin: 0 0 4px; font-size: 20px; }
      p { margin: 0 0 16px; font-size: 14px; color: var(--muted); line-height: 1.45; }
      label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
      input { width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 10px;
        border: 1px solid var(--line); outline: none; margin-bottom: 12px; }
      input:focus { border-color: var(--accent); }
      button { width: 100%; font-size: 15px; font-weight: 600; padding: 10px; border: 0;
        border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
      button:disabled { opacity: .5; }
      .msg { min-height: 20px; margin: 10px 0 0; font-size: 13px; }
      .err { color: #b5184a; }
      .ok { color: #0f6e56; }
      .links { margin-top: 14px; font-size: 13px; text-align: center; }
      .links a { color: var(--accent); text-decoration: none; font-weight: 600; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <form id="f" novalidate>
      <div class="logo">🎛️</div>
      <h1 id="title">Soundboard</h1>
      <p id="sub"></p>
      <div id="f-email"><label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" inputmode="email" /></div>
      <div id="f-password"><label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" /></div>
      <div id="f-confirm" hidden><label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password" /></div>
      <button id="go" type="submit">Sign in</button>
      <div class="msg" id="msg" role="alert"></div>
      <div class="links" id="links"></div>
    </form>
    <script>
      const $ = (id) => document.getElementById(id);
      const mode = location.pathname.replace(/^\//, "") || "login"; // login | forgot | reset | invite
      const qs = new URLSearchParams(location.search);
      const token = qs.get("token") || "";
      const MIN = 10;
      const show = (id, on) => { $(id).hidden = !on; };
      const say = (text, ok) => { $("msg").textContent = text; $("msg").className = "msg " + (ok ? "ok" : "err"); };
      const next = () => {
        const n = qs.get("next") || "/";
        return n.startsWith("/") && !n.startsWith("//") ? n : "/";
      };
      const post = async (path, data) => {
        const res = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
        const json = await res.json().catch(() => ({}));
        return { ok: res.ok, status: res.status, json };
      };

      const MODES = {
        login: {
          title: "Soundboard", sub: "Sign in to continue. This device stays signed in.", button: "Sign in",
          fields: ["f-email", "f-password"],
          links: '<a href="/forgot">Forgot password?</a>',
          async submit() {
            const r = await post("/api/auth/login", { email: $("email").value, password: $("password").value });
            if (r.ok) return location.replace(next());
            say(r.json.error || "Sign-in failed (" + r.status + ")");
          },
        },
        forgot: {
          title: "Forgot password", sub: "Enter your email and we'll send you a link to set a new password.", button: "Send reset link",
          fields: ["f-email"], links: '<a href="/login">Back to sign in</a>',
          async submit() {
            const r = await post("/api/auth/forgot", { email: $("email").value });
            say(r.ok ? r.json.message : r.json.error || "Request failed (" + r.status + ")", r.ok);
          },
        },
        reset: {
          title: "Choose a new password", sub: "", button: "Set password & sign in",
          fields: ["f-password", "f-confirm"], links: '<a href="/login">Back to sign in</a>', needsToken: true,
          async submit() { await redeem("/api/auth/reset"); },
        },
        invite: {
          title: "Welcome to Soundboard", sub: "", button: "Set password & sign in",
          fields: ["f-password", "f-confirm"], links: "", needsToken: true,
          async submit() { await redeem("/api/auth/accept-invite"); },
        },
      };
      const m = MODES[mode] || MODES.login;

      async function redeem(path) {
        const pw = $("password").value;
        if (pw.length < MIN) return say("Password must be at least " + MIN + " characters.");
        if (pw !== $("confirm").value) return say("Passwords don't match.");
        const r = await post(path, { token, password: pw });
        if (r.ok) return location.replace("/");
        say(r.json.error || "Request failed (" + r.status + ")");
      }

      document.title = "Soundboard · " + m.title;
      $("title").textContent = m.title;
      $("sub").textContent = m.sub;
      $("go").textContent = m.button;
      $("links").innerHTML = m.links;
      for (const id of ["f-email", "f-password", "f-confirm"]) show(id, m.fields.includes(id));
      if (m.needsToken) {
        $("password").autocomplete = "new-password";
        $("password").placeholder = "At least " + MIN + " characters";
        $("go").disabled = true;
        fetch("/api/auth/link?token=" + encodeURIComponent(token)).then(async (res) => {
          const j = await res.json().catch(() => ({}));
          if (!res.ok || j.purpose !== mode) {
            $("sub").textContent = "";
            say((j.error || "This link is invalid or has expired.") + (mode === "reset" ? " Request a new one." : " Ask an admin to resend your invite."));
            if (mode === "reset") $("links").innerHTML = '<a href="/forgot">Request a new link</a>';
            return;
          }
          $("sub").textContent = (mode === "invite" ? "Hi " + (j.name || j.email) + " — pick a password for " : "Set a new password for ") + j.email + ".";
          $("go").disabled = false;
          $("password").focus();
        });
      } else {
        $("email").focus();
      }

      $("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        $("go").disabled = true; say("");
        try { await m.submit(); } catch { say("Network error — try again."); }
        $("go").disabled = false;
      });
    </script>
  </body>
</html>
